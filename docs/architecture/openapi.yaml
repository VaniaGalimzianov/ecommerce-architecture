openapi: 3.0.4
info:
  title: Online Store API
  description: |
    The great online store's API swagger.

    Roles:
      - customer — can browse products, create orders and access own profile.
      - admin — has customer permissions and can also create, update and delete products.
  version: 1.0.0
servers:
- url: https://virtserver.swaggerhub.com/caxema8598organizati/client-server-itmo-2-work/1.0.0
  description: SwaggerHub API Auto Mocking
- url: http://localhost:8000
  description: Local server
- url: https://swagger.online-store.ru/api/v1
  description: Main server
tags:
- name: products
  description: Operations with products
- name: orders
  description: Operations with orders
- name: users
  description: User registration and authentication
paths:
  /products:
    get:
      tags:
      - products
      summary: Get filtered products
      description: Public endpoint. Authentication is not required.
      operationId: getProducts
      parameters:
      - name: categories
        in: query
        description: Filter products by categories ids
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: integer
      - name: min_price
        in: query
        description: Minimum product price
        required: false
        schema:
          minimum: 0
          type: number
          format: float
          example: 100
      - name: max_price
        in: query
        description: Maximum product price
        required: false
        schema:
          minimum: 0
          type: number
          format: float
          example: 1500
      - name: limit
        in: query
        description: Maximum count of products to return
        required: false
        schema:
          maximum: 100
          minimum: 1
          type: integer
          default: 20
      - name: offset
        in: query
        description: Count of products to skip
        required: false
        schema:
          minimum: 0
          type: integer
          default: 0
      responses:
        "200":
          description: List of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags:
      - products
      summary: Create product
      description: Creates a new product. Allowed only for users with the admin role.
      operationId: createProduct
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductCreate"
        required: true
      responses:
        "201":
          description: Product successfully created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden. Admin role required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
      - bearerAuth: []
  /products/{product_id}:
    get:
      tags:
      - products
      summary: Get product by ID
      operationId: getProductById
      parameters:
      - name: product_id
        in: path
        required: true
        schema:
          type: integer
          example: 15
      responses:
        "200":
          description: Product found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      tags:
      - products
      summary: Update product
      operationId: updateProduct
      parameters:
      - name: product_id
        in: path
        description: Product ID
        required: true
        schema:
          type: integer
          example: 15
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdate"
        required: true
      responses:
        "200":
          description: Product successfully updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden. Admin role required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
      - bearerAuth: []
    delete:
      tags:
      - products
      summary: Delete product
      operationId: deleteProduct
      parameters:
      - name: product_id
        in: path
        description: Product ID
        required: true
        schema:
          type: integer
          example: 15
      responses:
        "204":
          description: Product successfully deleted
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden. Admin role required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
      - bearerAuth: []
  /orders:
    post:
      tags:
      - orders
      summary: Create order
      operationId: createOrder
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderCreate"
        required: true
      responses:
        "201":
          description: Order successfully created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Product is unavailable or insufficient stock
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden. Customer or admin role required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
      - bearerAuth: []
  /orders/{order_id}:
    get:
      tags:
      - orders
      summary: Get order by ID
      description: |
        Returns information about an order
      operationId: getOrderById
      parameters:
      - name: order_id
        in: path
        description: Order ID
        required: true
        schema:
          type: integer
          example: 1001
      responses:
        "200":
          description: Order found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden. Customer cannot access another user's order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
      - bearerAuth: []
  /users/register:
    post:
      tags:
      - users
      summary: Register user
      description: |
        Creates a new customer account.
        New users are registered with the customer role.
      operationId: registerUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreate"
        required: true
      responses:
        "201":
          description: User successfully registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "409":
          description: User with this email already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /users/login:
    post:
      tags:
      - users
      summary: Login
      description: Authenticates a user and returns a JWT access token.
      operationId: loginUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          description: Successfully authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Token"
        "401":
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /users/me:
    get:
      tags:
      - users
      summary: Get current user
      description: |
        Returns information about the authenticated user.
        Available for customer and admin roles.
      operationId: getCurrentUser
      responses:
        "200":
          description: Current user information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden. User does not have an allowed role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
      - bearerAuth: []
components:
  schemas:
    Product:
      required:
      - category
      - id
      - name
      - price
      - stock
      type: object
      properties:
        id:
          type: integer
          example: 15
        name:
          type: string
          example: Apple MacBook Air 13
        description:
          type: string
          example: Laptop with Apple M4
        price:
          minimum: 0
          type: number
          format: float
          example: 1199.99
        category:
          type: string
          example: laptops
        brand:
          type: string
          example: Apple
        stock:
          minimum: 0
          type: integer
          example: 25
        image_url:
          type: string
          format: uri
          example: https://online-store.ru/s3/macbook.jpg
        is_available:
          type: boolean
          example: true
    ProductCreate:
      required:
      - category
      - name
      - price
      - stock
      type: object
      properties:
        name:
          maxLength: 200
          minLength: 1
          type: string
          example: Apple MacBook Air 13
        description:
          maxLength: 2000
          type: string
          example: Laptop with Apple M4
        price:
          minimum: 0
          type: number
          format: float
          example: 1199.99
        category:
          type: string
          example: laptops
        brand:
          type: string
          example: Apple
        stock:
          minimum: 0
          type: integer
          example: 25
        image_url:
          type: string
          format: uri
          example: https://online-store.ru/s3/macbook.jpg
    ProductUpdate:
      type: object
      properties:
        name:
          maxLength: 200
          minLength: 1
          type: string
          example: Apple MacBook Air 13
        description:
          maxLength: 2000
          type: string
        price:
          minimum: 0
          type: number
          format: float
          example: 1099.99
        category:
          type: string
          example: laptops
        brand:
          type: string
          example: Apple
        stock:
          minimum: 0
          type: integer
          example: 20
        image_url:
          type: string
          format: uri
    OrderItem:
      required:
      - product_id
      - quantity
      type: object
      properties:
        product_id:
          type: integer
          example: 15
        quantity:
          minimum: 1
          type: integer
          example: 2
    OrderCreate:
      required:
      - items
      - shipping_address
      type: object
      properties:
        items:
          minItems: 1
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        shipping_address:
          minLength: 5
          type: string
          example: "Brivibas iela 10, Riga, Latvia"
    Order:
      required:
      - created_at
      - id
      - items
      - status
      - total_price
      - user_id
      type: object
      properties:
        id:
          type: integer
          example: 1001
        user_id:
          type: integer
          example: 42
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        total_price:
          type: number
          format: float
          example: 2399.98
        shipping_address:
          type: string
          example: "Brivibas iela 10, Riga, Latvia"
        status:
          type: string
          description: Current order status
          example: pending
          enum:
          - pending
          - paid
          - processing
          - shipped
          - delivered
          - cancelled
        created_at:
          type: string
          format: date-time
          example: 2026-09-27T10:30:00Z
    UserCreate:
      required:
      - email
      - name
      - password
      type: object
      properties:
        name:
          maxLength: 100
          minLength: 2
          type: string
          example: Anton Ozerov
        email:
          type: string
          format: email
          example: anton@gmail.com
        password:
          minLength: 8
          type: string
          format: password
          example: password123
    User:
      required:
      - email
      - id
      - name
      - role
      type: object
      properties:
        id:
          type: integer
          example: 42
        name:
          type: string
          example: Anton Ozerov
        email:
          type: string
          format: email
          example: anton@gmail.com
        role:
          type: string
          description: User role used for authorization
          example: customer
          enum:
          - customer
          - admin
    LoginRequest:
      required:
      - email
      - password
      type: object
      properties:
        email:
          type: string
          format: email
          example: anton@gmail.com
        password:
          type: string
          format: password
          example: password123
    Token:
      required:
      - access_token
      - token_type
      type: object
      properties:
        access_token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        token_type:
          type: string
          example: bearer
    Error:
      required:
      - detail
      type: object
      properties:
        detail:
          type: string
          example: Forbidden
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
